<html>
<head>
<title>Form</title>
    <link rel="icon" type="image/png" href="snimki/3037366.png">
</head>
<body>
    <form action="index.php" method="POST" enctype="multipart/form-data">
        
        <label for="username">username:</label>
        <input type="text" id="username" placeholder="your_name" minlength="6" required>
        <br>
        
        <label for="password">password:</label>
        <input type="password" id="password" required minlength="8">
        <br>
         
        <label for="email">email</label>
        <input type="email" id="email" placeholder="georg35.lol@gmail.com">
        <br> 
        
        <label for="date">date:</label>
        <input type="date" id="date">
        <br>
        <label for="number">number:</label>
        <input type="number" id="number">
        <br>
        
        <label for="sex">sex: </label>
        <label for="men">men</label>
        <input type="radio" id="men" value="men" name="sex">
        
        <label for="woman">woman</label>
        <input type="radio" id="woman" value="woman" name="sex">
        
        <label for="else">else</label>
        <input type="radio" id="else" value="else" name="sex">
        <br>
        <label for="pay">payment</label>
        <select id="pay">
            <option value="visa">visa</option>
            <option value="cash">cash</option>
            <option value="giftcard">giftcard</option>

        </select><br>
        <label for="receipt">receipt</label>
        <input type="checkbox" id="receipt">
        <br>

        <label for="comment">coment</label>
        <br>
        <textarea id="comment" rows="4" cols="30"></textarea>
        <br>

        <label for="file">file:</label>
        <input type="file" id="file" accept="audio/mpeg">
        <br>
        
        <input type="reset">
        <input type="submit">
    </form>
</body>

</html>
